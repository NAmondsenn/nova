<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1024">
  <title>Approve? - Nova</title>
  <!-- At /approve/<request id>, so the settings page's files are asked for from the top. -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/Outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/settings.css">
  <script src="/base64url.js" defer></script>
  <script src="/sky.js" defer></script>
  <script src="/approve.js" defer></script>
</head>
<!-- The phone's approval page, which his notification opens: what Nova would do, and Approve or
     Refuse, drawn by approve.js. -->
<body class="approving">
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="page">
    <header class="masthead">
      <div class="identity">
        <div class="star" data-activity="idle" aria-hidden="true">
          <span class="glow"></span>
          <span class="ring"></span>
          <span class="spike"></span>
          <span class="spike crossed"></span>
          <span class="core"></span>
        </div>
        <div>
          <h1 class="name">Nova</h1>
          <p class="doing">Asks for your OK</p>
        </div>
      </div>
    </header>

    <main class="panel approval" aria-labelledby="approve-title">
      <h2 class="heading" id="approve-title"><svg class="icon" aria-hidden="true"><use href="#i-key"></use></svg>Approve?</h2>
      <!-- What it is for, as text: "Remove 'Dentist', Tue 25 Nov 10:00". -->
      <p class="description" id="description" hidden></p>
      <div class="entry" id="buttons" hidden>
        <button type="button" class="button" id="approve">Approve</button>
        <button type="button" class="button quiet" id="refuse">Refuse</button>
      </div>
      <p class="said" id="said" role="status" hidden></p>
    </main>
  </div>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L19 4"/><path d="M16 7l2.5 2.5"/><path d="M13.5 9.5l2 2"/></symbol>
  </svg>
</body>
</html>
